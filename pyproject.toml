[project]
name = "gorget"
description = "Security scanners for LLM prompts and responses: prompt injection, PII, secrets, toxicity and more. A maintained continuation of LLM Guard."
authors = [
  { name = "Perruer" },
  { name = "Protect AI (original LLM Guard authors)", email = "community@protectai.com" },
]
maintainers = [
  { name = "Perruer" },
]
keywords = ["llm", "language model", "security", "prompt injection", "prompt leakage", "PII detection", "anonymization", "guardrails", "firewall", "llm-guard"]
license = { file="LICENSE" }
readme = "README.md"
version = "0.5.0"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]
requires-python = ">=3.10"

# PyTorch is optional: without it every scanner runs on ONNX Runtime.
dependencies = [
  "bc-detect-secrets>=1.5.43,<2",
  "faker>=37",
  "fuzzysearch>=0.7,<1",
  "huggingface-hub>=0.26",
  "json-repair>=0.44",
  "nltk>=3.9.1,<4",
  "numpy>=1.26",
  "onnxruntime>=1.18",
  "presidio-analyzer>=2.2.362,<3",
  "presidio-anonymizer>=2.2.362,<3",
  "regex>=2024.11.6",
  "structlog>=24",
  "tiktoken>=0.9,<1",
  "transformers>=4.53,<6",
]

[project.optional-dependencies]
torch = [
  "torch>=2.4",
]
# Kept for requirement files written for LLM Guard; ONNX Runtime is now a core dependency.
onnxruntime = [
  "onnxruntime>=1.18",
]
docs-dev = [
  "mkdocs>=1.6,<2",
  "mkdocs-autorefs==1.4.4",
  "mkdocs-git-revision-date-localized-plugin>=1.4.0",
  "mkdocs-jupyter>=0.25.1",
  "mkdocs-material>=9.6.14",
  "mkdocs-material-extensions>=1.3.1",
  "mkdocs-swagger-ui-tag>=0.7.1",
]
dev = [
  "gorget[docs-dev]",
  "autoflake>=2,<3",
  "pytest>=8.3.5",
  "pytest-cov>=6.1.1",
  "pre-commit>=4.2.0,<5",
  "pyright>=1.1.400",
  "ruff>=0.16",
]

[project.urls]
homepage = "https://github.com/Perruer/gorget"
documentation = "https://perruer.github.io/gorget/"
repository = "https://github.com/Perruer/gorget"
issues = "https://github.com/Perruer/gorget/issues"
changelog = "https://perruer.github.io/gorget/changelog/"

[tool.setuptools]
packages = {find = {where=["."], include=["gorget", "gorget.*", "llm_guard"]}}
license-files = []

[tool.setuptools.package-data]
gorget = ["data/*.txt"]

[tool.pytest.ini_options]
addopts = "-p no:warnings"
log-level = "DEBUG"

# The flag below should only be activated in special debug sessions
# i.e. the test hangs and we need to see what happened up to that point.
# There are some race conditions with how the logging streams are closed in the teardown
# phase, which will cause tests to fail or "magically" ignored.
log_cli = "False"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
