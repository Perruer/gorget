name: Release

on:
  push:
    tags: ["v*"]
  # Run from a tag (Actions → Release → Use workflow from: v<version>) to publish
  # to PyPI after setting it up, without rebuilding the images.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Draft release with the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          notes="store/github-release-${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$GITHUB_REF_NAME" dist/* --draft \
            --title "Gorget ${GITHUB_REF_NAME#v}" --notes-file "$notes"

  pypi:
    # Needs a trusted publisher for this repository on PyPI and the
    # PYPI_PUBLISH repository variable set to "true".
    if: vars.PYPI_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: rm -f dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1

  images:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Prepare multi-arch builds
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx create --use
      - name: Build and push
        run: |
          image=ghcr.io/perruer/gorget-api
          version="${GITHUB_REF_NAME#v}"
          docker buildx build --platform linux/amd64,linux/arm64 -f gorget_api/Dockerfile \
            -t "$image:$version" -t "$image:latest" --push .
          docker buildx build --platform linux/amd64 -f gorget_api/Dockerfile-cuda \
            -t "$image:$version-cuda" -t "$image:latest-cuda" --push .
