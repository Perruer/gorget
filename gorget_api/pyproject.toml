[project]
name = "gorget-api"
description = "Gorget API is a deployment of Gorget as an API."
authors = [
  { name = "Perruer" },
  { name = "Protect AI (original LLM Guard authors)", email = "community@protectai.com" }
]
readme = "README.md"
dynamic = ["version"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.10,<3.13"

dependencies = [
    "asyncio==3.4.3",
    "fastapi==0.115.12",
    "gorget==0.4.0.dev0",
    "pydantic==2.11.4",
    "pyyaml==6.0.2",
    "uvicorn[standard]==0.34.2",
    "structlog>=24",
    "slowapi==0.1.9",
    "opentelemetry-instrumentation-fastapi==0.54b1",
    "opentelemetry-api==1.33.1",
    "opentelemetry-sdk==1.33.1",
    "opentelemetry-exporter-otlp-proto-http==1.33.1",
    "opentelemetry-exporter-prometheus==0.54b1",
    "opentelemetry-sdk-extension-aws==2.1.0",
    "opentelemetry-propagator-aws-xray==1.0.2",
    "psutil>=5.9"
]

[project.optional-dependencies]
cpu = [
  "gorget[onnxruntime]==0.4.0.dev0",
]
gpu = [
  "gorget[onnxruntime-gpu]==0.4.0.dev0",
]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.dynamic]
version = {attr = "app.version.__version__"}

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
