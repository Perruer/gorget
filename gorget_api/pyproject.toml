[project]
name = "gorget-api"
description = "Gorget API is a deployment of Gorget as an API."
authors = [
  { name = "Perruer" },
  { name = "Protect AI (original LLM Guard authors)", email = "community@protectai.com" }
]
readme = "README.md"
dynamic = ["version"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115",
    "gorget>=0.5.0",
    "pydantic>=2.7",
    "pyyaml>=6",
    "uvicorn[standard]>=0.30",
    "structlog>=24",
    "slowapi>=0.1.9",
    "opentelemetry-instrumentation-fastapi>=0.54b1",
    "opentelemetry-api>=1.33.1",
    "opentelemetry-sdk>=1.33.1",
    "opentelemetry-exporter-otlp-proto-http>=1.33.1",
    "opentelemetry-exporter-prometheus>=0.54b1",
    "opentelemetry-sdk-extension-aws>=2.1.0",
    "opentelemetry-propagator-aws-xray>=1.0.2",
    "psutil>=5.9",
]

[project.optional-dependencies]
# The CPU image runs on ONNX Runtime, which the library already depends on.
cpu = []
gpu = [
  "gorget[torch]>=0.5.0",
]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.dynamic]
version = {attr = "app.version.__version__"}

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
